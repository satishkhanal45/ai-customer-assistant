services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-customer-assistant-postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ai_assistant
      POSTGRES_PASSWORD: ai_customer_assistant_password
      POSTGRES_DB: ai_customer_assistant
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_assistant} -d ${POSTGRES_DB:-ai_customer_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: ai-customer-assistant-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - ./backend/.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: ai-customer-assistant-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-knowledge-documents} &&
      echo 'MinIO bucket ready'
      "
    restart: "no"

  tika:
    image: apache/tika:latest-full
    container_name: ai-customer-assistant-tika
    restart: unless-stopped
    ports:
      - "9998:9998"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9998'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Named so the worker can reuse this exact image instead of building a
    # second, byte-identical copy of the same 3 GB context.
    image: ai-customer-assistant:local
    container_name: ai-customer-assistant-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      MINIO_ENDPOINT: minio:9000
      TIKA_BASE_URL: http://tika:9998
      FRONTEND_DIR: /app/frontend
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      tika:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions
      - ./frontend:/app/frontend

  # Ingestion runs here, not in the API process. The API only enqueues a job
  # row; this consumer claims it and runs the pipeline (Tika, the embedding
  # model, LLM entity extraction). Keeping the heavy work out of the web
  # process is why /ingest/* returns 202 instead of doing the work inline.
  #
  # Deliberately not scaled past one replica by default: claim_next_job takes
  # a FOR UPDATE SKIP LOCKED row lock and guards one job per source, so extra
  # replicas are safe, but each one loads its own copy of the 400 MB
  # embedding model.
  worker:
    # Same image as the backend - same code, different entrypoint. Reusing it
    # avoids a duplicate build and guarantees the API and the worker can never
    # drift onto different versions of the pipeline.
    image: ai-customer-assistant:local
    container_name: ai-customer-assistant-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      MINIO_ENDPOINT: minio:9000
      TIKA_BASE_URL: http://tika:9998
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      tika:
        condition: service_healthy
      # Migrations run in the backend's entrypoint; wait for it so the worker
      # never queries a table that does not exist yet.
      backend:
        condition: service_started
    # Bypasses the backend entrypoint's migrate-and-serve path: the worker
    # neither migrates nor serves HTTP.
    entrypoint: ["python", "scripts/run_worker.py"]

volumes:
  postgres_data:
  minio_data: