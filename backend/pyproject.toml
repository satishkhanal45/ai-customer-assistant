[project]
name = "ai-customer-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.140.13",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "sentence-transformers>=5.6.1",
    "sqlalchemy>=2.0.51",
    "transformers>=5.14.1",
    "uvicorn[standard]>=0.51.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3.6",
    "langgraph>=1.2.10",
    "aiosqlite>=0.22.1",
    "greenlet>=3.5.4",
    "pydantic>=2.13.4",
    "anthropic>=0.120.2",
    "groq>=1.6.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
[tool.pytest.ini_options]
pythonpath = [".", "src/ai_customer_assistant"]
testpaths = ["tests"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_customer_assistant"]
