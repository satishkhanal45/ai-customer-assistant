[project]
name = "ai-customer-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.140.13",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "sentence-transformers>=5.6.1",
    "sqlalchemy>=2.0.51",
    "transformers>=5.14.1",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = [".", "src/ai-customer-assistant"]
testpaths = ["tests"]