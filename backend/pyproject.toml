[project]
name = "ai-customer-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "fastapi>=0.140.13",
    "langchain-core>=1.2.17",
    "minio>=7.2.18",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "sentence-transformers>=5.6.1",
    "sqlalchemy>=2.0.51",
    "transformers>=5.14.1",
    "uvicorn[standard]>=0.51.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3.6",
    "pytest>=9.1.1",
    "trafilatura>=2.2.0",
    "greenlet>=3.5.4",
    "lxml>=5.2",
    "langchain-groq>=1.1.3",
    "langchain>=0.2.7",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
pythonpath = [".", "src/ai_customer_assistant"]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_customer_assistant"]
