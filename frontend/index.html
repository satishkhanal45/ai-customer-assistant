<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Customer Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/theme.css">
<script>
(function () {
  var t = 'dark';
  try { t = localStorage.getItem('aca.theme') || 'dark'; } catch (e) {}
  if (t !== 'light') t = 'dark';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
</head>
<body>
<div class="app">

  <!-- ================= HEADER ================= -->
  <header class="header">
    <div class="graph-field" aria-hidden="true">
      <svg viewBox="0 0 800 60" preserveAspectRatio="none">
        <g class="gf-drift">
          <line class="gf-edge" x1="40" y1="20" x2="120" y2="42"/>
          <line class="gf-edge" x1="120" y1="42" x2="210" y2="15"/>
          <line class="gf-edge" x1="210" y1="15" x2="300" y2="38"/>
          <line class="gf-edge" x1="300" y1="38" x2="400" y2="12"/>
          <line class="gf-edge" x1="400" y1="12" x2="480" y2="45"/>
          <line class="gf-edge" x1="480" y1="45" x2="570" y2="20"/>
          <line class="gf-edge" x1="570" y1="20" x2="660" y2="40"/>
          <line class="gf-edge" x1="660" y1="40" x2="740" y2="15"/>
          <circle class="gf-node gf-pulse" cx="40" cy="20" r="3"/>
          <circle class="gf-node alt gf-pulse" cx="120" cy="42" r="3" style="animation-delay:.4s"/>
          <circle class="gf-node gf-pulse" cx="210" cy="15" r="3" style="animation-delay:.8s"/>
          <circle class="gf-node alt gf-pulse" cx="300" cy="38" r="3" style="animation-delay:1.2s"/>
          <circle class="gf-node gf-pulse" cx="400" cy="12" r="3" style="animation-delay:1.6s"/>
          <circle class="gf-node alt gf-pulse" cx="480" cy="45" r="3" style="animation-delay:2s"/>
          <circle class="gf-node gf-pulse" cx="570" cy="20" r="3" style="animation-delay:2.4s"/>
          <circle class="gf-node alt gf-pulse" cx="660" cy="40" r="3" style="animation-delay:2.8s"/>
          <circle class="gf-node gf-pulse" cx="740" cy="15" r="3" style="animation-delay:3.2s"/>
        </g>
      </svg>
    </div>
    <div class="header-left">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="6" r="2.3" fill="currentColor"/><circle cx="18" cy="7" r="2.3" fill="currentColor"/><circle cx="12" cy="18" r="2.3" fill="currentColor"/><circle cx="18" cy="17" r="1.6" fill="currentColor" opacity=".7"/><path d="M7.8 7.2 10.2 16 M16.2 8.2 13 16.3 M8.2 6 16 6.8 M13.5 17.5 16.5 17" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" opacity=".85"/></svg>
      </div>
      <div class="brand">AI Customer Assistant</div>
      <div class="status-pill" id="sysStatus"><span class="dot"></span><span>System Online</span></div>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="themeToggle" title="Toggle theme"></button>
      <div class="avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg></div>
    </div>
  </header>

  <!-- ================= SIDEBAR ================= -->
  <nav class="sidebar" id="sidebar">
    <div class="nav-label">Workspace</div>
    <div class="nav-items" id="navItems"></div>
    <button class="sidebar-collapse-btn" id="sidebarCollapseBtn" title="Collapse sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="m14 10-2 2 2 2" id="collapseArrow"/></svg>
      <span>Collapse</span>
    </button>
    <div class="sidebar-footer">v1.0 · Prototype</div>
  </nav>

  <!-- ================= MAIN CONTENT ================= -->
  <main class="main" id="view"></main>

</div>
<div id="statusbar"></div>
<div id="loading"><div class="spinner"></div></div>

<script src="src/utils.js"></script>
<script src="src/config.js"></script>
<script src="src/api.js"></script>
<script src="src/router.js"></script>
<script src="src/pages/overview.js"></script>
<script src="src/pages/chat.js"></script>
<script src="src/pages/graph.js"></script>
<script src="src/pages/ingest.js"></script>
<script src="src/pages/admin.js"></script>
<script>window.ACA.router.init();</script>
</body>
</html>
