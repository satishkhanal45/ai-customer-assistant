# MinIO for raw document storage (crawler output + uploaded PDFs/DOCX/etc.),
# per README's architecture diagram ("Storage (MinIO) -> raw files").
#
# Usage as a standalone stack:
#   docker compose -f docker-compose.minio.yml up -d
#
# Or merge the `minio` service + `minio_data` volume below into your
# existing docker-compose.yml if you'd rather run it alongside postgres
# and the backend in one file/network.

services:
  minio:
    image: minio/minio:latest
    container_name: ai-customer-assistant-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # One-shot bucket bootstrap: creates the bucket the storage/ package
  # writes to, then exits. Runs after minio's healthcheck passes.
  minio-init:
    image: minio/mc:latest
    container_name: ai-customer-assistant-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-knowledge-documents} &&
      echo 'MinIO bucket ready'
      "
    restart: "no"

volumes:
  minio_data:
